name: slice03-runtime-mode-orchestrator

on:
  push:
    branches:
      - 'delivery/slice-03-runtime-mode-orchestrator'
  pull_request:
    paths:
      - 'src/SplitOS.RuntimeHost/ModeRuntime/**'
      - 'src/SplitOS.Persistence.Machine/**'
      - 'src/SplitOS.Contracts/Protocol/**'
      - 'tests/SplitOS.RuntimeHost.Tests/**'
      - '.github/workflows/slice03-runtime-mode-orchestrator.yml'

permissions:
  contents: read

jobs:
  runtime-mode-orchestrator:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.110'

      - name: Restore RuntimeHost tests
        run: dotnet restore tests/SplitOS.RuntimeHost.Tests/SplitOS.RuntimeHost.Tests.csproj -p:Platform=x64

      - name: Build RuntimeHost tests
        run: dotnet build tests/SplitOS.RuntimeHost.Tests/SplitOS.RuntimeHost.Tests.csproj -c Release --no-restore -p:Platform=x64

      - name: Test Runtime mode orchestrator
        run: dotnet test tests/SplitOS.RuntimeHost.Tests/SplitOS.RuntimeHost.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter FullyQualifiedName~RuntimeModeOrchestratorTests
