name: temp-slice03-action-plan-patch

on:
  push:
    branches:
      - delivery/slice-03-durable-action-plan
    paths:
      - eng/lab/apply-slice03-action-plan.py
      - .github/workflows/temp-slice03-action-plan-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: delivery/slice-03-durable-action-plan
          fetch-depth: 0

      - name: Apply action-plan patch
        run: python eng/lab/apply-slice03-action-plan.py

      - name: Commit product patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/SplitOS.Persistence.Machine/MachineStateStore.cs \
            src/SplitOS.Persistence.Machine/ModeTransitionStore.cs \
            tests/SplitOS.Persistence.Tests/ModeTransitionStoreTests.cs \
            tests/SplitOS.Persistence.Tests/ModeTransitionCommitStoreTests.cs \
            tests/SplitOS.Persistence.Tests/ModeTransitionPolicyStoreTests.cs
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'delivery: integrate durable mode action plan'
          git push origin HEAD:delivery/slice-03-durable-action-plan
