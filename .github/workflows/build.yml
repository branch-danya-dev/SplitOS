name: build

on:
  push:
    branches:
      - main
      - 'delivery/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.110'

      - name: Restore
        run: dotnet restore SplitOS.sln -p:Platform=x64

      - name: Build
        run: dotnet build SplitOS.sln -c Release --no-restore -p:Platform=x64

      - name: Test contracts
        run: dotnet test tests/SplitOS.Contracts.Tests/SplitOS.Contracts.Tests.csproj -c Release --no-build -p:Platform=x64

      - name: Test RuntimeHost
        run: dotnet test tests/SplitOS.RuntimeHost.Tests/SplitOS.RuntimeHost.Tests.csproj -c Release --no-build -p:Platform=x64

      - name: Test mode transition domain
        run: dotnet test tests/SplitOS.RuntimeHost.Tests/SplitOS.RuntimeHost.Tests.csproj -c Release --no-build -p:Platform=x64 --filter FullyQualifiedName~ModeTransitionDomainTests

      - name: Test native auth transaction core
        run: dotnet test tests/SplitOS.RuntimeHost.Tests/SplitOS.RuntimeHost.Tests.csproj -c Release --no-build -p:Platform=x64 --filter FullyQualifiedName~NativeAuthTransactionManagerTests

      - name: Test native auth loopback flow
        run: dotnet test tests/SplitOS.RuntimeHost.Tests/SplitOS.RuntimeHost.Tests.csproj -c Release --no-build -p:Platform=x64 --filter FullyQualifiedName~NativeAuthLoopbackFlowTests

      - name: Test native auth token validation
        run: dotnet test tests/SplitOS.RuntimeHost.Tests/SplitOS.RuntimeHost.Tests.csproj -c Release --no-build -p:Platform=x64 --filter FullyQualifiedName~NativeAuthTokenExchangeTests

      - name: Test account and entitlement product API
        run: dotnet test tests/SplitOS.RuntimeHost.Tests/SplitOS.RuntimeHost.Tests.csproj -c Release --no-build -p:Platform=x64 --filter FullyQualifiedName~ProductApiClientTests

      - name: Test durable login bootstrap
        run: dotnet test tests/SplitOS.RuntimeHost.Tests/SplitOS.RuntimeHost.Tests.csproj -c Release --no-build -p:Platform=x64 --filter FullyQualifiedName~DurableLoginBootstrapCoordinatorTests

      - name: Test refresh token rotation
        run: dotnet test tests/SplitOS.RuntimeHost.Tests/SplitOS.RuntimeHost.Tests.csproj -c Release --no-build -p:Platform=x64 --filter FullyQualifiedName~NativeSessionRefreshServiceTests

      - name: Test same-account reauthentication
        run: dotnet test tests/SplitOS.RuntimeHost.Tests/SplitOS.RuntimeHost.Tests.csproj -c Release --no-build -p:Platform=x64 --filter FullyQualifiedName~SameAccountReauthenticationCoordinatorTests

      - name: Test online entitlement runtime access
        run: dotnet test tests/SplitOS.RuntimeHost.Tests/SplitOS.RuntimeHost.Tests.csproj -c Release --no-build -p:Platform=x64 --filter FullyQualifiedName~RuntimeAccessEvaluatorTests

      - name: Test authenticated entitlement refresh
        run: dotnet test tests/SplitOS.RuntimeHost.Tests/SplitOS.RuntimeHost.Tests.csproj -c Release --no-build -p:Platform=x64 --filter FullyQualifiedName~AuthenticatedEntitlementRefreshCoordinatorTests

      - name: Test session entitlement lifecycle
        run: dotnet test tests/SplitOS.RuntimeHost.Tests/SplitOS.RuntimeHost.Tests.csproj -c Release --no-build -p:Platform=x64 --filter FullyQualifiedName~SessionEntitlementLifecycleCoordinatorTests

      - name: Test offline entitlement assertion validation
        run: dotnet test tests/SplitOS.RuntimeHost.Tests/SplitOS.RuntimeHost.Tests.csproj -c Release --no-build -p:Platform=x64 --filter FullyQualifiedName~OfflineEntitlementAssertionValidatorTests

      - name: Test semantic runtime Auth.Start
        run: dotnet test tests/SplitOS.RuntimeHost.Tests/SplitOS.RuntimeHost.Tests.csproj -c Release --no-build -p:Platform=x64 --filter FullyQualifiedName~RuntimeAuthStartCoordinatorTests

      - name: Test semantic runtime sign-out
        run: dotnet test tests/SplitOS.RuntimeHost.Tests/SplitOS.RuntimeHost.Tests.csproj -c Release --no-build -p:Platform=x64 --filter FullyQualifiedName~RuntimeSignOutCommandTests

      - name: Test Broker
        run: dotnet test tests/SplitOS.Broker.Tests/SplitOS.Broker.Tests.csproj -c Release --no-build -p:Platform=x64

      - name: Test IPC integration
        run: dotnet test tests/SplitOS.IntegrationTests/SplitOS.IntegrationTests.csproj -c Release --no-build -p:Platform=x64

      - name: Restore persistence tests
        run: dotnet restore tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -p:Platform=x64

      - name: Build persistence tests
        run: dotnet build tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-restore -p:Platform=x64

      - name: Test persistence SQLite policy
        run: dotnet test tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter FullyQualifiedName~SqlitePolicyTests

      - name: Test machine schema migration
        run: dotnet test tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter "Name=LegacyV1MigratesOnlyAfterVerifiedBackupAndPreservesState|Name=SchemaV2MigratesToV3PreservesStateAndExistingLease"

      - name: Test machine schema v4 migration
        run: dotnet test tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter FullyQualifiedName~MachineSchemaV4Tests

      - name: Test machine schema v5 migration
        run: dotnet test tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter FullyQualifiedName~MachineSchemaV5Tests

      - name: Test machine corruption quarantine
        run: dotnet test tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter Name=CorruptCanonicalStoreIsPreservedAndQuarantined

      - name: Test machine write durability
        run: dotnet test tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter "Name=OperationalModeWriteSurvivesRestartAndReplaysIdempotently|Name=StaleRevisionDoesNotOverwriteNewerCanonicalState|Name=ReusedOperationIdWithDifferentRequestIsRejected"

      - name: Test machine bootstrap invariants
        run: dotnet test tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter "Name=FirstBootstrapCreatesDurableNone|Name=MissingCanonicalDatabaseAfterBootstrapDoesNotFabricateNone"

      - name: Test major mutation lease fencing
        run: dotnet test tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter FullyQualifiedName~MachineMutationLeaseStoreTests

      - name: Test durable mode transition journal
        run: dotnet test tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter FullyQualifiedName~ModeTransitionStoreTests

      - name: Test durable mode policy binding
        run: dotnet test tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter FullyQualifiedName~ModeTransitionPolicyStoreTests

      - name: Test durable mode action plan journal
        run: dotnet test tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter FullyQualifiedName~ModeTransitionActionPlanStoreTests

      - name: Test durable mode action execution journal
        run: dotnet test tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter FullyQualifiedName~ModeTransitionActionJournalStoreTests

      - name: Test durable rollback and transition evidence
        run: dotnet test tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter FullyQualifiedName~ModeTransitionRollbackStoreTests

      - name: Test atomic mode commit boundary
        run: dotnet test tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter FullyQualifiedName~ModeTransitionCommitStoreTests

      - name: Test user association persistence
        run: dotnet test tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter FullyQualifiedName~UserAssociationStoreTests

      - name: Test same-account reactivation persistence
        run: dotnet test tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter FullyQualifiedName~UserAssociationReactivationStoreTests

      - name: Test user canonical recovery
        run: dotnet test tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter "FullyQualifiedName~UserCanonicalRecoveryTests|FullyQualifiedName~UserCanonicalInvariantRecoveryTests"

      - name: Test persistence user/projection
        run: dotnet test tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter FullyQualifiedName~UserAndProjectionStoreTests

      - name: Test protected account secrets
        run: dotnet test tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter FullyQualifiedName~ProtectedAccountSecretStoreTests

      - name: Test protected secret ACLs
        run: dotnet test tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter FullyQualifiedName~ProtectedSecretAclTests

      - name: Test protected trusted-time evidence
        run: dotnet test tests/SplitOS.Persistence.Tests/SplitOS.Persistence.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64 --filter FullyQualifiedName~ProtectedTrustedTimeEvidenceTests

      - name: Publish SplitOS artifacts
        shell: pwsh
        run: ./eng/publish.ps1 -Configuration Release

      - name: Validate artifact manifest
        shell: pwsh
        run: |
          $manifestPath = 'artifacts/publish/artifact-manifest.json'
          if (-not (Test-Path $manifestPath)) { throw 'artifact-manifest.json was not generated.' }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.architecture -ne 'x64') { throw 'Unexpected artifact architecture.' }
          if ($manifest.files.Count -lt 4) { throw 'Published artifact set is unexpectedly empty.' }

      - name: Broker Windows Service smoke
        shell: pwsh
        run: ./eng/lab/test-broker-service-ci.ps1
